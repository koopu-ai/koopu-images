name: postgres-publish

on:
  workflow_dispatch:
    inputs:
      expected_existing_digest:
        description: Optional sha256 digest for an already-published immutable tag
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish-reviewed-main:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LOCAL_IMAGE: koopu/postgres:pg18.6-ts2.29.1-pgv0.8.6-b4
      PUBLISH_IMAGE: ghcr.io/koopu-ai/postgres:pg18.6-ts2.29.1-pgv0.8.6-b4
      EXPECTED_EXISTING_DIGEST: ${{ inputs.expected_existing_digest }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - name: Install an isolated Buildx builder
        id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          use: false
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the immutable release state
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$EXPECTED_EXISTING_DIGEST" \
            && ! "$EXPECTED_EXISTING_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'expected existing digest is invalid: %s\n' "$EXPECTED_EXISTING_DIGEST" >&2
            exit 2
          fi
          set +e
          inspect_output="$(docker buildx imagetools inspect "$PUBLISH_IMAGE" 2>&1)"
          inspect_exit=$?
          set -e
          printf '%s\n' "$inspect_output"
          if [[ "$inspect_exit" -eq 0 ]]; then
            remote_digest="$(awk '$1 == "Digest:" { print $2; exit }' <<< "$inspect_output")"
            if [[ ! "$remote_digest" =~ ^sha256:[0-9a-f]{64}$ \
              || "$remote_digest" != "$EXPECTED_EXISTING_DIGEST" ]]; then
              printf 'release exists; attest it by supplying its exact digest: remote=%s expected=%s\n' \
                "$remote_digest" "$EXPECTED_EXISTING_DIGEST" >&2
              exit 1
            fi
            printf 'publish_required=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$inspect_output" != *"not found"* && "$inspect_output" != *"manifest unknown"* ]]; then
            printf 'registry lookup failed without a definitive absent-tag result\n' >&2
            exit 1
          fi
          [[ -z "$EXPECTED_EXISTING_DIGEST" ]] || { printf 'expected tag is absent\n' >&2; exit 1; }
          printf 'publish_required=true\n' >> "$GITHUB_OUTPUT"
      - name: Build and verify the reviewed payload
        shell: bash
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            architecture="${platform#linux/}"
            TARGET_PLATFORM="$platform" \
              BUILDER_NAME="${{ steps.buildx.outputs.name }}" \
              NO_CACHE=1 images/postgres/build.sh
            TARGET_PLATFORM="$platform" images/postgres/health-check.sh "$LOCAL_IMAGE"
            TARGET_PLATFORM="$platform" images/postgres/artifact-fingerprint.sh "$LOCAL_IMAGE" \
              > "$RUNNER_TEMP/postgres-fingerprint-${architecture}"
            docker image rm --force "$LOCAL_IMAGE"
          done
      - name: Publish the dual-platform index once
        if: steps.release.outputs.publish_required == 'true'
        shell: bash
        run: |
          BUILD_MODE=push \
            TARGET_PLATFORMS=linux/amd64,linux/arm64 \
            IMAGE_TAG="$PUBLISH_IMAGE" \
            BUILDER_NAME="${{ steps.buildx.outputs.name }}" \
            images/postgres/build.sh
      - name: Attest and record the immutable registry digest
        shell: bash
        run: |
          set -euo pipefail
          inspect_output="$(docker buildx imagetools inspect "$PUBLISH_IMAGE")"
          printf '%s\n' "$inspect_output"
          remote_digest="$(awk '$1 == "Digest:" { print $2; exit }' <<< "$inspect_output")"
          remote="${PUBLISH_IMAGE%:*}@${remote_digest}"
          [[ "$remote" =~ ^ghcr\.io/koopu-ai/postgres@sha256:[0-9a-f]{64}$ ]]
          raw="$(docker buildx imagetools inspect --raw "$remote")"
          platforms="$(jq -r '[.manifests[]?.platform | select(.os == "linux" and (.architecture == "amd64" or .architecture == "arm64")) | (.os + "/" + .architecture)] | unique | sort | join(",")' <<< "$raw")"
          [[ "$platforms" == "linux/amd64,linux/arm64" ]]
          for platform in linux/amd64 linux/arm64; do
            architecture="${platform#linux/}"
            docker pull --platform "$platform" "$remote"
            [[ "$(docker image inspect "$remote" --format '{{.Architecture}}')" == "$architecture" ]]
            actual="$(TARGET_PLATFORM="$platform" images/postgres/artifact-fingerprint.sh "$remote")"
            expected="$(cat "$RUNNER_TEMP/postgres-fingerprint-${architecture}")"
            [[ "$actual" == "$expected" ]]
            docker image rm --force "$remote"
          done
          printf 'published_ref=%s\nplatforms=%s\n' "$remote" "$platforms"
          printf '### Published PostgreSQL image\n\n`%s`\n' "$remote" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove only release-job images
        if: always()
        shell: bash
        run: docker image rm --force "$LOCAL_IMAGE" "$PUBLISH_IMAGE" || true
